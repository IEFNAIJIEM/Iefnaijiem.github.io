<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEFNAIJIEM | 个人主页</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons 图标库 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans SC"', 'sans-serif'],
          },
          animation: {
            'blob': 'blob 12s infinite',
          },
          keyframes: {
            blob: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(25px, -30px) scale(1.05)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.95)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 玻璃拟态与悬浮质感 */
    .glass-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dark .glass-card {
      background: rgba(18, 22, 34, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.45);
    }

    .link-item {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link-item:hover {
      transform: translateY(-2px);
    }

    /* 细腻的点阵网格背景 */
    .bg-grid {
      background-size: 28px 28px;
      background-image: radial-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 1px);
    }
    .dark .bg-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    }

    /* 平滑色彩过渡 */
    * {
      transition-property: background-color, border-color, color;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 200ms;
    }
  </style>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0a0d14] text-slate-800 dark:text-slate-100 min-h-screen relative font-sans selection:bg-indigo-500 selection:text-white flex flex-col justify-between p-4 sm:p-6 overflow-x-hidden">

  <!-- 背景动态柔光光晕 -->
  <div class="fixed inset-0 bg-grid pointer-events-none z-0"></div>
  <div class="fixed top-12 left-1/2 -translate-x-1/2 w-[28rem] h-[28rem] bg-indigo-500/15 dark:bg-indigo-600/15 rounded-full blur-3xl animate-blob pointer-events-none z-0"></div>
  <div class="fixed bottom-10 right-1/4 w-80 h-80 bg-purple-400/15 dark:bg-purple-600/10 rounded-full blur-3xl animate-blob [animation-delay:4s] pointer-events-none z-0"></div>

  <!-- 页面主体容器（极简居中，适配手机与电脑） -->
  <div class="relative z-10 w-full max-w-lg mx-auto py-8 sm:py-12 flex-1 flex flex-col justify-center">
    
    <!-- 顶部操作栏：夜间模式切换 -->
    <div class="flex justify-end mb-4">
      <button id="themeToggle" class="p-2.5 rounded-2xl glass-card text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" aria-label="切换主题" title="切换深浅主题">
        <i data-lucide="sun" id="sunIcon" class="w-4 h-4 hidden"></i>
        <i data-lucide="moon" id="moonIcon" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 个人资料卡片 (Avatar + Bio) -->
    <div class="glass-card rounded-3xl p-6 sm:p-8 text-center mb-5">
      
      <!-- 头像 -->
      <div class="relative inline-block mb-4">
        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl p-1 bg-gradient-to-b from-slate-200 to-slate-300 dark:from-slate-700 dark:to-slate-800 shadow-md mx-auto">
          <img 
            id="avatarImg"
            src="avatar.jpg" 
            alt="IEFNAIJIEM Avatar" 
            class="w-full h-full object-cover rounded-[14px] bg-white"
          />
        </div>
      </div>

      <!-- 名字与 Handle -->
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-1">
        IEFNAIJIEM
      </h1>
      <p class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 mb-3 tracking-wide">
        @IEFNAIJIEM
      </p>

      <!-- 简介 -->
      <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed max-w-sm mx-auto">
        热爱折腾新奇的东西，爱好是摄影和音乐。
      </p>

    </div>

    <!-- 链接列表 (可自由点击与添加) -->
    <div class="space-y-3">
      
      <!-- 链接 1: GitHub -->
      <a href="https://github.com/IEFNAIJIEM" target="_blank" rel="noopener noreferrer" 
         class="link-item glass-card rounded-2xl p-4 flex items-center justify-between group hover:border-slate-900 dark:hover:border-slate-400">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center shrink-0">
            <i data-lucide="github" class="w-5 h-5"></i>
          </div>
          <div class="text-left">
            <div class="font-bold text-sm text-slate-800 dark:text-slate-100">GitHub</div>
            <div class="text-xs text-slate-400">@IEFNAIJIEM</div>
          </div>
        </div>
        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 group-hover:text-slate-800 dark:group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
      </a>

      <!-- 链接 2: 哔哩哔哩 (摄影 & 音乐动态) -->
      <a href="https://space.bilibili.com" target="_blank" rel="noopener noreferrer" 
         class="link-item glass-card rounded-2xl p-4 flex items-center justify-between group hover:border-pink-500">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-[#fb7299] text-white flex items-center justify-center shrink-0">
            <i data-lucide="tv" class="w-5 h-5"></i>
          </div>
          <div class="text-left">
            <div class="font-bold text-sm text-slate-800 dark:text-slate-100">Bilibili</div>
            <div class="text-xs text-slate-400">视频记录与日常</div>
          </div>
        </div>
        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 group-hover:text-pink-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
      </a>

      <!-- 链接 3: 个人博客 / 主页 -->
      <a href="https://your-blog.com" target="_blank" rel="noopener noreferrer" 
         class="link-item glass-card rounded-2xl p-4 flex items-center justify-between group hover:border-indigo-500">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0">
            <i data-lucide="compass" class="w-5 h-5"></i>
          </div>
          <div class="text-left">
            <div class="font-bold text-sm text-slate-800 dark:text-slate-100">个人博客 / 空间</div>
            <div class="text-xs text-slate-400">文章随笔与记录</div>
          </div>
        </div>
        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 group-hover:text-indigo-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
      </a>

      <!-- 链接 4: 邮箱联系 -->
      <a href="mailto:your-email@example.com" 
         class="link-item glass-card rounded-2xl p-4 flex items-center justify-between group hover:border-emerald-500">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0">
            <i data-lucide="mail" class="w-5 h-5"></i>
          </div>
          <div class="text-left">
            <div class="font-bold text-sm text-slate-800 dark:text-slate-100">Email</div>
            <div class="text-xs text-slate-400">联系我 / 交流合作</div>
          </div>
        </div>
        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 group-hover:text-emerald-500 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
      </a>

      <!-- 
        ➕【想添加新链接？复制下面这段代码粘贴即可】：
        <a href="你的链接地址" target="_blank" rel="noopener noreferrer" 
           class="link-item glass-card rounded-2xl p-4 flex items-center justify-between group hover:border-indigo-500">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-slate-800 text-white flex items-center justify-center shrink-0">
              <i data-lucide="link" class="w-5 h-5"></i>
            </div>
            <div class="text-left">
              <div class="font-bold text-sm text-slate-800 dark:text-slate-100">链接名称</div>
              <div class="text-xs text-slate-400">副标题描述</div>
            </div>
          </div>
          <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 group-hover:text-indigo-500 transition-all"></i>
        </a>
      -->

    </div>

  </div>

  <!-- 极简页脚 -->
  <footer class="relative z-10 text-center py-4 text-xs text-slate-400 dark:text-slate-600">
    <p>© 2026 IEFNAIJIEM · Hosted on GitHub Pages</p>
  </footer>

  <script>
    // 初始化 Lucide 图标
    lucide.createIcons();

    // 昼夜模式切换
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
    }

    themeToggle.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
